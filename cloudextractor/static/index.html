<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudExtractor</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/">Cloud<span>Extractor</span></a>
      <label class="account">Apple ID <select id="account" disabled></select></label>
    </div>
  </header>

  <main>
    <section class="control" aria-labelledby="control-heading">
      <div class="control-heading">
        <h1 id="control-heading">Pobieranie iCloud</h1>
        <span id="status" class="status" role="status">Łączenie</span>
      </div>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <dl class="job-stats" aria-label="Postęp zadania">
        <div><dt>Workery konta</dt><dd id="job-workers">—</dd></div>
        <div><dt>Pobrane pliki</dt><dd id="job-downloaded">—</dd></div>
        <div><dt id="job-list-label">Biblioteka iCloud</dt><dd id="job-list-size">—</dd></div>
        <div><dt>Zakres zadania</dt><dd id="job-scope">—</dd></div>
      </dl>
      <p class="activity" id="activity" aria-live="polite"></p>
      <div class="job-file">
        <span id="job-file-label">Plik</span>
        <span class="job-file-name" id="job-file">—</span>
      </div>
      <div class="controls">
        <label class="limit">Zakres
          <select id="limit" disabled>
            <option value="dates">Według dat</option>
            <option value="20">20 ostatnich pozycji</option>
            <option value="50">50 ostatnich pozycji</option>
            <option value="100">100 ostatnich pozycji</option>
            <option value="500">500 ostatnich pozycji</option>
            <option value="1000">1000 ostatnich pozycji</option>
            <option value="">Cała biblioteka</option>
          </select>
        </label>
        <div class="controls" id="date-fields">
          <label class="limit">Od <input id="date-from" type="date" aria-describedby="date-zone" required disabled></label>
          <label class="limit">Do <input id="date-to" type="date" aria-describedby="date-zone" required disabled></label>
        </div>
        <div class="date-presets" role="group" aria-label="Szybki wybór zakresu dat">
          <button type="button" data-days="1" disabled>Dziś</button>
          <button type="button" data-days="7" disabled>7 dni</button>
          <button type="button" data-days="30" disabled>30 dni</button>
        </div>
      </div>
      <p class="date-zone" id="date-zone"></p>
      <div class="controls job-actions">
        <button class="primary" id="run" disabled>Uruchom pobieranie</button>
        <button id="stop" class="stop" disabled>Zatrzymaj</button>
        <button id="scan" disabled>Skanuj iCloud</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="library" aria-labelledby="library-heading">
      <div class="library-heading">
        <h2 id="library-heading">Biblioteka</h2>
        <p id="scope"></p>
      </div>
      <p id="library-error" class="error" role="status" hidden></p>
      <div class="storage-summary" aria-label="Łączne rozmiary biblioteki">
        <div class="storage-card">
          <span>iCloud Photos · razem</span>
          <strong id="cloud-total">—</strong>
          <p id="cloud-scope"></p>
          <p id="cloud-filtered" hidden></p>
        </div>
        <div class="storage-card">
          <span>Lokalne archiwum · razem</span>
          <strong id="local-total">—</strong>
          <p id="local-filtered" hidden></p>
        </div>
      </div>
      <div class="filters">
        <label>Typ pliku
          <select id="media-filter">
            <option value="both">Obrazy i filmy</option>
            <option value="image">Obrazy</option>
            <option value="video">Filmy</option>
          </select>
        </label>
        <label>Katalog
          <select id="folder-filter"><option value="">Wszystkie katalogi</option></select>
        </label>
      </div>
      <details class="folder-summary">
        <summary>Rozmiary katalogów</summary>
        <div class="folder-table">
          <table aria-label="Rozmiary katalogów dla wybranego typu plików">
            <thead><tr><th scope="col">Katalog</th><th scope="col">iCloud</th><th scope="col">Lokalnie</th></tr></thead>
            <tbody id="folder-sizes"></tbody>
          </table>
        </div>
      </details>
      <div class="library-nav">
        <div class="tabs" role="tablist" aria-label="Źródło plików">
          <button id="tab-downloaded" role="tab" aria-controls="library-content" aria-selected="true" data-view="downloaded">Pobrane <span id="downloaded-count">—</span></button>
          <button id="tab-pending" role="tab" aria-controls="library-content" aria-selected="false" data-view="pending">Do pobrania <span id="pending-count">—</span></button>
        </div>
        <label class="layout-picker">Widok
          <select id="library-layout">
            <option value="gallery">Galeria</option>
            <option value="calendar">Kalendarz</option>
          </select>
        </label>
      </div>
      <div id="library-content" role="tabpanel" aria-labelledby="tab-downloaded">
        <div id="gallery-tools" class="gallery-tools">
          <div class="view-options">
            <label>Sortuj według
              <select id="gallery-sort">
                <option value="date">Daty wykonania</option>
                <option value="size">Rozmiaru</option>
                <option value="type">Typu (obraz / film)</option>
                <option value="format">Formatu</option>
                <option value="name">Nazwy pliku</option>
              </select>
            </label>
            <label>Kolejność
              <select id="gallery-order">
                <option value="desc">Malejąco</option>
                <option value="asc">Rosnąco</option>
              </select>
            </label>
            <label><span id="page-size-label">Pliki na stronę</span>
              <select id="page-size">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </label>
            <label id="grouping-control">Grupowanie zdjęć
              <select id="group-interval">
                <option value="0">Wyłączone</option>
                <option value="2">Odstęp do 2 s</option>
                <option value="5">Odstęp do 5 s</option>
                <option value="10">Odstęp do 10 s</option>
                <option value="30">Odstęp do 30 s</option>
                <option value="45">Odstęp do 45 s</option>
                <option value="60">Odstęp do 60 s</option>
                <option value="90">Odstęp do 90 s</option>
                <option value="180">Odstęp do 180 s</option>
              </select>
            </label>
          </div>
          <nav id="pagination" class="pagination" aria-label="Strony plików">
            <button id="previous" aria-label="Poprzednia strona" disabled>←</button>
            <form id="page-jump">
              <label for="page-number">Strona</label>
              <input type="number" id="page-number" value="1" min="1" step="1" inputmode="numeric" required>
              <span id="page-count">/ 1</span>
              <button type="submit">Przejdź</button>
            </form>
            <button id="next" aria-label="Następna strona" disabled>→</button>
          </nav>
          <div class="gallery-scope">
            <details id="gallery-date-filter">
              <summary>Zakres dat</summary>
              <form id="gallery-date-form">
                <label>Od <input id="gallery-date-from" type="date" required></label>
                <label>Do <input id="gallery-date-to" type="date" required></label>
                <button type="submit">Zastosuj</button>
              </form>
            </details>
            <button type="button" id="clear-range" hidden></button>
            <span id="gallery-result-count" hidden></span>
            <p id="gallery-date-note" role="status" hidden></p>
          </div>
        </div>
        <div id="items" class="gallery"></div>
        <section id="calendar-panel" class="calendar-panel" aria-label="Kalendarz plików" hidden>
          <div class="calendar-toolbar">
            <label class="layout-picker">Liczba miesięcy
              <select id="calendar-size">
                <option value="1">1</option>
                <option value="3" selected>3</option>
                <option value="6">6</option>
                <option value="12">12</option>
              </select>
            </label>
            <div class="calendar-nav" aria-label="Nawigacja kalendarza">
              <button type="button" id="calendar-previous" aria-label="Starsze miesiące">←</button>
              <button type="button" id="calendar-today">Bieżący miesiąc</button>
              <button type="button" id="calendar-next" aria-label="Nowsze miesiące" disabled>→</button>
            </div>
            <span class="calendar-legend"><strong>I</strong> obrazy · <strong>V</strong> filmy</span>
          </div>
          <p id="calendar-period" class="calendar-period" role="status"></p>
          <p id="calendar-note" class="calendar-note" hidden></p>
          <div id="calendar-months" class="calendar-months"></div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="group-viewer" class="group-dialog" aria-labelledby="group-title">
    <header class="group-header">
      <div>
        <h2 id="group-title">Zdjęcia w grupie</h2>
        <p id="group-info" aria-live="polite"></p>
      </div>
      <button type="button" id="close-group" aria-label="Zamknij grupę">×</button>
    </header>
    <div id="group-items" class="gallery"></div>
    <footer class="group-footer"><button type="button" id="group-more" hidden>Wczytaj kolejne zdjęcia</button></footer>
  </dialog>

  <dialog id="viewer" aria-labelledby="filename">
    <header class="viewer-header">
      <div id="filename"></div>
      <a id="original" download>Oryginał</a>
      <button id="close-viewer" aria-label="Zamknij podgląd">×</button>
    </header>
    <div id="preview" class="preview"></div>
  </dialog>
</body>
</html>
